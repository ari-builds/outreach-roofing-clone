<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Single Page App redirect for GitHub Pages
    // Preserves the path and query string when redirecting to index.html
    (function() {
      var path = window.location.pathname;
      var query = window.location.search;
      var hash = window.location.hash;
      
      // If we're on the 404 page (or any non-root path), redirect to index.html
      // with the original path preserved in a query parameter
      if (path !== '/' && path !== '/index.html') {
        // Encode the path and query for the redirect
        var redirectPath = encodeURIComponent(path + query + hash);
        window.location.href = '/index.html?redirect=' + redirectPath;
      }
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #FAFAFA;
      color: #1C3D72;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid #3A6ACB;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader" aria-label="Loading..."></div>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/index.html">
  </noscript>
</body>
</html>
