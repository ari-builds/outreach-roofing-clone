<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outreach Roofing and Construction</title>
  <script>
    /* GitHub Pages SPA fallback.
       Pages has no rewrites, so unknown paths land here. We bounce to the real
       index.html inside the repo subpath and hand it the intended route. */
    (function () {
      var BASE = '/outreach-roofing-clone';
      var path = window.location.pathname || '/';
      if (path.indexOf(BASE) === 0) { path = path.slice(BASE.length) || '/'; }
      window.location.replace(
        BASE + '/index.html?redirect=' +
        encodeURIComponent(path + window.location.search + window.location.hash)
      );
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #FAFAFA; color: #1C3D72;
    }
    .loader {
      width: 40px; height: 40px; border: 3px solid #3A6ACB;
      border-top-color: transparent; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <noscript><meta http-equiv="refresh" content="0; url=/outreach-roofing-clone/"></noscript>
</head>
<body>
  <div class="loader" aria-label="Loading..."></div>
</body>
</html>
